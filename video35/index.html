<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: pink;
            height: 83px;
            position: sticky;
            top: 0;
        }

        main {
            background-color: black;
            color: white;
            padding: 34px;
        }

        .container {
            background-color: rgb(0, 255, 55);
            margin: 12px 34px;
            /*  height: 233px; */
            text-align: center;
            padding: 55px 23px;
        }

        .box1 {
            background-color: violet;
            height: 70vh;
            width: 50%;
            display: inline-block;
            margin: 0 12px;
        }

        .box2 {
            background-color: red;
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .text-box {
            padding: 34px;
            border: 2px solid white;
            margin: 10 34vw;
            font-size: 2em;
            border-radius: 13px;
            text-align: center;

        }

        .orangebox {
            background-color: aqua;
        }

        footer {
            height: 100px;
            background-color: bisque;
        }
    </style>

</head>

<body>
    <header>
        <nav>
            
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text-box">
            <p> Welcome to web development journey </p>
        </div>
        <div class="orangebox">

        </div>
    </main>

    <footer>

    </footer>
</body>

</html>
