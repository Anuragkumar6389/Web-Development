<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position </title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box1 {
            background-color: aqua;
            position: absolute;
            top: 8px;
            left: 144px;
            /* position: sticky;
            top: 0px;
            width: 100%;
            margin: 0;
            padding: 0; */
        }

        .box2 {
            background-color: green;
            position: relative;
            top: 0px;
            left: 3px;
        }

        .box3 {
            background-color: yellow;
            /* position: fixed; 
          bottom: 0px;
          left: 8vw;
          height: 111px;  */
        }

        .box4 {
            background-color: purple;
        }

        .box {
            border: 2px solid black;
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;

        }

        .parent {
            /*Exception: transform ,filter or persepctive properties properties can also make an element appear as positioned */
            padding: 43px;
            margin: 34px;
            border: 3px soild purple;
            position: absolute;
            /*  transform: translate(0); */
            /*  filter: invert(0);*/
        }
    </style>
</head>

<body>
    <div class="box parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
