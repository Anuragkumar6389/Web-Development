<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Element Selector */
        div {
        /*   background-color: red; */
        }

        /* Class selector*/

        .red {
            background-color: red;
        }

        /* id Selector */
        #green {
            background-color: green;
        }

        /* child selector*/
        div>p {
            color: blue;
            background-color: brown;
        }

        /* Descendent selector*/
        div p {
            color: blue;
            background-color: brown;
        }

        /* universal selector*/

        * {
            margin: 0;
            padding: 0;
        }

        /* Pseudo Selector*/
        a:visited {
            color: blue;
        }

        a:link {
            color: green;
        }

        a:active {
            background-color: red;
        }

        a:hover {
            background-color: yellow;
        }

        p:first-child {
            background-color: aqua;
        }
    </style>
</head>

<body>
    <main class="one">
        <p>Iam first</p>
        <p>I am Second</p>
    </main>
    <div class="red">
        I am A div
        <article>
            <p>I am a para inside div</p>
        </article>
    </div>

    <div id="green">
        I am Another div
    </div>
    <a href="https://www.Google.com">go to google</a>
    <a href="htttps://www.whatsapp.com">Go to whatsapp</a>
</body>

</html>
